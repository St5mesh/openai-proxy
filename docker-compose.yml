services:
  # HAProxy - OpenAI API Proxy
  openai-proxy:
    image: haproxy:2.8-alpine
    container_name: openai-proxy
    entrypoint: ["haproxy", "-f"]
    command: ["/usr/local/etc/haproxy/haproxy.cfg"]
    volumes:
      - ./openai-proxy-docker.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "${PROXY_PORT:-2020}:2020"
    depends_on:
      - whisper
      - ollama
      - tts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -O- -S http://127.0.0.1:2020/health 2>&1 | grep -q 'healthy'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - openai-proxy-network

  # Whisper.cpp - Audio Transcription Service
  whisper:
    image: fedirz/faster-whisper-server:latest-cuda
    container_name: whisper-service
    ports:
      - "${WHISPER_PORT:-8000}:8000"
    environment:
      - WHISPER__MODEL=${WHISPER_MODEL:-Systran/faster-whisper-large-v3}
      - WHISPER__INFERENCE_DEVICE=cuda
    volumes:
      - whisper-models:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - openai-proxy-network

  # Ollama - Large Language Model Service
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-service
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - OLLAMA_FLASH_ATTENTION=1
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - openai-proxy-network

  # Kokoro-FastAPI - Text-to-Speech Service
  tts:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    container_name: tts-service
    ports:
      - "${TTS_PORT:-8880}:8880"
    volumes:
      - tts-models:/app/api/src/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - openai-proxy-network

volumes:
  whisper-models:
    driver: local
  ollama-models:
    driver: local
  tts-models:
    driver: local

networks:
  openai-proxy-network:
    driver: bridge
