# OpenAI API Proxy Configuration for Docker Compose
# This configuration routes OpenAI API requests to local Docker services

frontend openai_proxy
    bind *:2020 v4v6
    mode http
    
    # Timeout settings
    timeout client 30s

    # Add custom request ID to all responses
    http-response set-header X-Request-ID %[unique-id]

    # Set required proxy headers
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Port %[dst_port]
    http-request set-header X-Forwarded-For %[src]

    # Health check endpoint
    acl path_health path /health
    http-request return status 200 content-type "text/plain" string "healthy" if path_health

    # Route based on path
    acl path_audio_transcriptions path_beg /v1/audio/transcriptions
    acl path_chat_completions path_beg /v1/chat/completions
    acl path_audio_speech path_beg /v1/audio/speech
    # Additional audio-related endpoints (some backends use these)
    acl path_audio_voices path_beg /v1/audio/voices
    acl path_models path_beg /v1/models
    acl path_v1 path_beg /v1

    # Welcome page for root and non-v1 paths
    acl path_root path /
    acl path_non_v1 path_reg ^/(?!v1)
    http-request return status 200 content-type "text/html" string "<!DOCTYPE html><html><head><title>Welcome to OpenAI-Proxy</title><style>body{font-family:sans-serif;max-width:800px;margin:40px auto;padding:0 20px}.endpoint{background:#f4f4f4;padding:10px;margin:10px 0;border-radius:4px}.title{color:#333}</style></head><body><h1>Welcome to OpenAI-Proxy</h1><p>Available API endpoints:</p><div class=\"endpoint\">/v1/audio/transcriptions - Audio transcription service (Whisper)</div><div class=\"endpoint\">/v1/chat/completions - Chat completions service (Ollama)</div><div class=\"endpoint\">/v1/audio/speech - Text to speech service (Kokoro-FastAPI)</div><div class=\"endpoint\">/v1/* - All other OpenAI API endpoints</div><p>All services are running in Docker containers with GPU acceleration.</p></body></html>" if path_root or path_non_v1

    # Route to appropriate backends
    # Audio Transcriptions - Using Whisper service
    use_backend backend_transcriptions_whisper if path_audio_transcriptions

    # Chat Completions - Using Ollama
    use_backend backend_chat_ollama if path_chat_completions

    # Audio Speech - Using Kokoro-FastAPI TTS
    use_backend backend_speech_local if path_audio_speech
    
    # Audio voices endpoint - route to same backend as speech
    use_backend backend_speech_local if path_audio_voices
    
    # Models endpoint - can be routed to any capable backend
    # For most accurate model lists, route to backend_openai
    use_backend backend_openai if path_models

    # Default OpenAI API
    use_backend backend_openai if path_v1

# =============================
# TRANSCRIPTION BACKENDS
# =============================

# OpenAI Transcription Backend
backend backend_transcriptions_openai
    mode http
    option forwardfor

    # Add backend identifier to response
    http-response set-header X-Backend "transcriptions_openai"

    # Timeout settings
    timeout connect 10s
    timeout server 30s

    # OpenAI API Configuration
    http-request set-header Host api.openai.com
    http-request set-header Authorization %[req.hdr(Authorization)]
    http-request set-header Content-Type %[req.hdr(Content-Type)]
    # Note: verify none is used because Alpine-based HAProxy may not have CA certificates
    # This is acceptable for a proxy fallback to OpenAI's public API
    # For production, consider adding ca-file parameter with proper certificates
    server openai api.openai.com:443 ssl verify none sni str(api.openai.com)

# Docker Whisper Backend (faster-whisper-server)
backend backend_transcriptions_whisper
    mode http
    option forwardfor

    # Add backend identifier to response
    http-response set-header X-Backend "transcriptions_whisper"

    # Timeout settings - increased for transcription processing
    timeout connect 10s
    timeout server 120s

    # Docker service configuration
    http-request set-header Host whisper
    server whisper whisper:8000

# =============================
# CHAT COMPLETION BACKENDS
# =============================

# OpenAI Chat Completions Backend
backend backend_chat_openai
    mode http
    option forwardfor
    
    # Add backend identifier to response
    http-response set-header X-Backend "chat_openai"
    
    # Timeout settings
    timeout connect 10s
    timeout server 30s
    
    # OpenAI API Configuration
    http-request set-header Host api.openai.com
    http-request set-header Authorization %[req.hdr(Authorization)]
    # Note: verify none - see comment in backend_transcriptions_openai for details
    server openai api.openai.com:443 ssl verify none sni str(api.openai.com)

# Docker Ollama Chat Completions Backend
backend backend_chat_ollama
    mode http
    option forwardfor
    
    # Add backend identifier to response
    http-response set-header X-Backend "chat_ollama"
    
    # Timeout settings - increased for LLM generation
    timeout connect 10s
    timeout server 120s
    
    # Docker service configuration
    http-request set-header Host ollama
    server ollama ollama:11434

# =============================
# SPEECH BACKENDS
# =============================

# OpenAI Speech Backend
backend backend_speech_openai
    mode http
    option forwardfor
    
    # Add backend identifier to response
    http-response set-header X-Backend "speech_openai"
    
    # Timeout settings
    timeout connect 10s
    timeout server 30s
    
    # OpenAI API Configuration
    http-request set-header Host api.openai.com
    http-request set-header Authorization %[req.hdr(Authorization)]
    # Note: verify none - see comment in backend_transcriptions_openai for details
    server openai api.openai.com:443 ssl verify none sni str(api.openai.com)

# Docker Kokoro-FastAPI TTS Backend
backend backend_speech_local
    mode http
    option forwardfor
    
    # Add backend identifier to response
    http-response set-header X-Backend "speech_local"
    
    # Timeout settings - increased for TTS generation
    timeout connect 10s
    timeout server 60s
    
    # Docker service configuration
    http-request set-header Host tts
    server tts tts:8880

# =============================
# DEFAULT OPENAI BACKEND
# =============================

# Default OpenAI Backend for all other API endpoints
backend backend_openai
    mode http
    option forwardfor
    
    # Add backend identifier to response
    http-response set-header X-Backend "openai_default"
    
    # Timeout settings
    timeout connect 10s
    timeout server 30s
    
    # OpenAI API Configuration
    http-request set-header Host api.openai.com
    # Note: verify none - see comment in backend_transcriptions_openai for details
    server openai api.openai.com:443 ssl verify none sni str(api.openai.com)
